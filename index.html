<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF7A1A">
<title>STEVEFLASH</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f5f4f2;--card:#fff;--tx:#1b1f23;--mut:#6b737b;--acc:#ff7a1a;--ok:#22a861;--bad:#e5484d;--bd:#e6e3df}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2226;--tx:#f2f2f0;--mut:#9aa3ab;--bd:#31363b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px}
.logo .mk{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#ff8a2b,#ff6a00);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 10px rgba(255,106,0,.4)}
.logo b{font-size:20px;letter-spacing:-.02em}
.logo b span{color:var(--acc)}
.hdrPill{font-size:12px;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);padding:5px 11px;border-radius:20px}
main{max-width:520px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 84px)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.06)}
.ct{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.k{color:var(--mut);font-size:13px}
.v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.sec{font-weight:700;font-size:15px;margin:16px 2px 10px;border-left:3px solid var(--acc);padding-left:9px;display:flex;align-items:center;gap:6px}
input,select{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;outline:none}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label.lbl{font-size:13px;font-weight:600;color:var(--mut);display:block;margin:2px 0 6px}
.btn{border:0;background:linear-gradient(135deg,#ff8a2b,#ff6a00);color:#fff;min-height:50px;padding:12px 20px;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;width:100%;box-shadow:0 4px 14px rgba(255,106,0,.35);transition:transform .12s,filter .12s,opacity .2s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.sm{width:auto;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx);box-shadow:none}
.btn.bad{background:var(--bad);box-shadow:0 4px 14px rgba(229,72,77,.3)}
.btn.ok{background:var(--ok);box-shadow:0 4px 14px rgba(34,168,97,.3)}
.btn.big{min-height:56px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.5;box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:5px 11px;border-radius:9px}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);font-size:13.5px;font-weight:600;color:var(--tx);cursor:pointer}
.chip:active{transform:scale(.96)}
/* origem/paradas */
.legRow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--bd)}
.legRow:last-child{border-bottom:0}
.legDot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;background:color-mix(in srgb,var(--acc) 12%,transparent)}
.legDot.a{background:color-mix(in srgb,var(--ok) 15%,transparent)}
.stopIn{min-height:44px}
.addStop{width:100%;margin-top:8px;min-height:44px;font-size:14px}
/* MAPA */
#mapWrap{position:relative;margin:12px 0 10px}
#map{height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--bd);z-index:0;background:#e8e6e2}
#map.dk .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
#mapWrap.full{position:fixed;inset:0;z-index:1500;margin:0}
#mapWrap.full #map{height:100%;border-radius:0;border:0}
.mb{position:absolute;right:10px;z-index:1000;width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:19px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);padding:0}
#mapWrap.full .mb{margin-top:env(safe-area-inset-top,0px)}
#bFull{top:10px}#bLay{top:62px}#bCen{top:114px}#bCen.on{color:var(--acc);border-color:var(--acc)}
#bZi{top:166px;font-size:22px;font-weight:700}#bZo{top:218px;font-size:22px;font-weight:700}
#mInfo{position:absolute;left:10px;right:64px;bottom:10px;z-index:1000;background:color-mix(in srgb,var(--card) 95%,transparent);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font-size:13px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#mapWrap.full #mInfo{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
#mInfo b{color:var(--acc);font-size:15px}
.empty{color:var(--mut);text-align:center;padding:28px 10px}
#sug{position:absolute;left:0;right:0;top:100%;z-index:1200;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.18);margin-top:6px;overflow:hidden;display:none}
.sg{padding:12px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.sg:last-child{border:0}.sg:active{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.sg b{display:block;font-size:15px}.sg span{font-size:12.5px;color:var(--mut)}
.me{width:18px;height:18px;border-radius:50%;background:#2f7cf6;border:3px solid #fff;box-shadow:0 0 0 2px rgba(47,124,246,.3),0 1px 4px rgba(0,0,0,.4)}
.mo{width:34px;height:34px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 7px rgba(255,122,26,.25),0 2px 8px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;transition:transform .4s}
.em{font-size:26px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
a.wa{color:var(--ok);text-decoration:none;font-weight:600}
/* BOTTOM SHEET estilo Uber */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1100;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--bd);box-shadow:0 -10px 34px rgba(0,0,0,.22);transform:translateY(106%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:520px;margin:0 auto;max-height:78vh;overflow-y:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
#sheet.on{transform:translateY(0)}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--bd);margin:10px auto 2px}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--bd);border-radius:16px;padding:11px 12px;margin-top:8px;cursor:pointer;transition:border-color .15s,background .15s}
.opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 7%,transparent)}
.opt .oi{font-size:27px;flex:none}
.opt .ot{flex:1;min-width:0}
.opt .ot b{display:block;font-size:15px}
.opt .ot span{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .oe{text-align:right;flex:none}
.opt .oe b{display:block;font-size:16px}
.opt .oe span{font-size:11.5px;color:var(--mut)}
.surge{display:flex;align-items:center;gap:8px;background:#fff1e0;border:1px solid #ffb30055;color:#c98a00;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:12px;margin-top:10px}
.routeChips{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:8px}
.routeChips .rcPill{font-size:11.5px;font-weight:600;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:4px 9px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.routeChips .rcArrow{color:var(--mut);font-size:11px}
/* TIMELINE */
.tl{display:flex;margin:14px 0 4px}
.tl .st{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--mut);font-weight:600}
.tl .st i{display:block;width:12px;height:12px;border-radius:50%;background:var(--bd);margin:0 auto 5px}
.tl .st.on{color:var(--ok)}
.tl .st.on i{background:var(--ok)}
.tl .st:not(:last-child)::before{content:"";position:absolute;top:6px;left:calc(50% + 9px);right:calc(-50% + 9px);height:2px;background:var(--bd)}
.tl .st.on:not(:last-child)::before{background:var(--ok)}
/* MOTORISTA card */
.drv{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:10px}
.drv .av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ff8a2b,#ff6a00);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;flex:none}
.drv .di{flex:1;min-width:0}
.drv .di b{font-size:16px}
.icobtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none}
.icobtn.red{border-color:var(--bad);color:var(--bad)}
/* paradas durante corrida */
.stopList{margin-top:10px;border-top:1px dashed var(--bd);padding-top:8px}
.stopItem{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.stopItem.done{color:var(--mut);text-decoration:line-through}
.stopItem.cur{font-weight:700}
.stopItem.cur .sd{background:var(--acc);color:#fff}
.sd{width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
/* RECIBO */
.rc{border-top:1px dashed var(--bd);margin-top:12px;padding-top:10px}
.rc .rr{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.rc .rr.total{font-size:18px;font-weight:800;color:var(--tx);border-top:1px solid var(--bd);margin-top:6px;padding-top:8px}
/* BOTTOM NAV */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:900;display:flex;background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabbar button{flex:1;background:none;border:0;padding:9px 4px 7px;color:var(--mut);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabbar button.on{color:var(--acc)}
#tabbar .ico{font-size:21px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:2000;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(255,122,26,.45),0 2px 8px rgba(0,0,0,.6)}100%{box-shadow:0 0 0 16px rgba(255,122,26,0),0 2px 8px rgba(0,0,0,.6)}}
.mo{animation:pu 2s ease-out infinite}
.pill.warn{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.mo,.pill.warn{animation:none}}
.leaflet-bottom.leaflet-left{margin-bottom:46px}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="mk">🛵</div><b>STEVE<span>FLASH</span></b></div>
  <span class="hdrPill" id="hdrPill" style="display:none"></span>
</header>
<main id="app"></main>
<div id="sheet"><div class="grab"></div><div id="sheetBody" style="padding:0 16px 4px"></div></div>
<div id="tabbar" style="display:none">
  <button data-tab="home"><span class="ico">🏠</span>Início</button>
  <button data-tab="ativ"><span class="ico">🧾</span>Atividade</button>
  <button data-tab="conta"><span class="ico">👤</span>Conta</button>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
<script>
"use strict";
const SB="https://bkjywijgogeyekwgqawq.supabase.co",KEY="sb_publishable_v8SlYZngr9uQ0vpBxlPDPg_GBKN_-Or";
const $=id=>document.getElementById(id);
const LS=k=>localStorage.getItem(k);
const brl=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const curta=(s,n=34)=>{s=String(s||"");return s.length>n?s.slice(0,n)+"…":s};
let tT=null;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2800)}
const AUTH=SB+"/auth/v1";
const sessGet=()=>{try{return JSON.parse(localStorage.getItem("sb_sess")||"null")}catch(e){return null}};
function sessSet(j){
  if(!j){localStorage.removeItem("sb_sess");return}
  const o=sessGet()||{};
  localStorage.setItem("sb_sess",JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000+(j.expires_in||3600)),user_id:(j.user&&j.user.id)||o.user_id||null}));
}
async function authCall(path,body){
  const r=await fetch(AUTH+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.msg||j.error_description||j.message||j.error||"erro "+r.status);
  return j;
}
let _tp=null;
function token(){
  const s=sessGet();
  if(s&&s.access_token&&s.expires_at>Date.now()/1000+60)return Promise.resolve(s.access_token);
  return _tp||(_tp=renovar().finally(()=>{_tp=null}));
}
async function renovar(){
  const s=sessGet();
  if(s&&s.refresh_token){
    try{const j=await authCall("/token?grant_type=refresh_token",{refresh_token:s.refresh_token});sessSet(j);return j.access_token}
    catch(e){sessSet(null)}
  }
  return novaSessao();
}
async function novaSessao(){const j=await authCall("/signup",{});sessSet(j);return j.access_token}
async function api(path,opt={}){
  const tk=await token();
  const r=await fetch(SB+"/rest/v1/"+path,{...opt,headers:{apikey:KEY,Authorization:"Bearer "+tk,"Content-Type":"application/json",Prefer:opt.prefer||"return=representation",...(opt.headers||{})}});
  if(r.status===401){const s=sessGet();if(s){s.expires_at=0;localStorage.setItem("sb_sess",JSON.stringify(s))}}
  if(!r.ok)throw new Error("erro "+r.status+": "+(await r.text()).slice(0,160));
  return (r.headers.get("content-type")||"").includes("json")?r.json():null;
}
const hav=(a,b,c,d)=>{const r=x=>x*Math.PI/180,p=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*6371*Math.asin(Math.sqrt(p))};
const brg=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b[1]-a[1]),y=Math.sin(dl)*Math.cos(r(b[0])),x=Math.cos(r(a[0]))*Math.sin(r(b[0]))-Math.sin(r(a[0]))*Math.cos(r(b[0]))*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360};
const soDig=t=>{const d=String(t||"").replace(/\D/g,"");return d.length<=11?"55"+d:d};
const ini=n=>String(n||"?").trim().split(/\s+/).map(p=>p[0]).slice(0,2).join("").toUpperCase();
const normParadas=c=>{if(!c||!c.paradas)return[];if(Array.isArray(c.paradas))return c.paradas;try{return JSON.parse(c.paradas)}catch(e){return[]}};

/* ====== MAPA ====== */
const CAMADAS=[
  {n:"Ruas",gl:"https://tiles.openfreemap.org/styles/liberty"},
  {n:"Claro",gl:"https://tiles.openfreemap.org/styles/positron"},
  {n:"Escuro",gl:"https://tiles.openfreemap.org/styles/dark",dk:1},
  {n:"Satélite",u:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",z:18}
];
let ultima=[],reenviando=false,me={lat:-27.816,lng:-50.326},map=null,layers={},dest=null,rota=null,poller=null,anim=null;
let lay=+LS("cli_lay")||0,tile=null,tracking=false,follow=false,rmBusy=false,rmFrom=null,etaBusy=false,etaFrom=null;
const icoMe=L.divIcon({html:'<div class="me"></div>',className:"",iconSize:[18,18],iconAnchor:[9,9]});
const icoFlag=L.divIcon({html:'<div class="em">🏁</div>',className:"",iconSize:[30,30],iconAnchor:[6,28]});
const icoStop=L.divIcon({html:'<div class="em">📍</div>',className:"",iconSize:[30,30],iconAnchor:[15,28]});
const icoMoto=L.divIcon({html:'<div class="em">🏍️</div>',className:"",iconSize:[30,30],iconAnchor:[15,15]});
const icoArrow=L.divIcon({html:'<div class="mo">▲</div>',className:"",iconSize:[34,34],iconAnchor:[17,17]});
const mapHtml=()=>`<div id="mapWrap"><div id="map"></div><button class="mb" id="bFull" aria-label="Tela cheia">⤢</button><button class="mb" id="bLay" aria-label="Trocar mapa">🗺️</button><button class="mb" id="bCen" aria-label="Centralizar">🎯</button><button class="mb" id="bZi" aria-label="Aproximar">+</button><button class="mb" id="bZo" aria-label="Afastar">−</button><div id="mInfo"></div></div>`;

function setLayer(i){
  lay=(i+CAMADAS.length)%CAMADAS.length;localStorage.setItem("cli_lay",lay);
  const c=CAMADAS[lay];let gl=false;
  if(tile)map.removeLayer(tile);
  tile=null;
  if(c.gl&&L.maplibreGL){try{tile=L.maplibreGL({style:c.gl,attribution:"© OpenFreeMap © OpenMapTiles Dados © OpenStreetMap"}).addTo(map);gl=true}catch(e){tile=null}}
  if(!tile)tile=L.tileLayer(c.u||"https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:c.z||19,maxNativeZoom:c.z||19,attribution:"© OpenStreetMap / Esri"}).addTo(map);
  if(tile.bringToBack)tile.bringToBack();
  $("map").classList.toggle("dk",!gl&&!!c.dk);
}
function initMap(){
  if(map){map.remove();map=null}
  layers={};rmFrom=null;etaFrom=null;follow=false;
  map=L.map("map",{zoomControl:false,zoomSnap:.5,minZoom:3,preferCanvas:true}).setView([me.lat,me.lng],14);
  map.attributionControl.setPrefix(false);
  setLayer(lay);
  L.control.scale({imperial:false,position:"bottomleft"}).addTo(map);
  layers.acc=L.circle([me.lat,me.lng],{radius:0,color:"#2f7cf6",weight:1,fillOpacity:.1,interactive:false}).addTo(map);
  layers.me=L.marker([me.lat,me.lng],{icon:icoMe}).addTo(map);
  layers.ms=L.layerGroup().addTo(map);
  map.on("dragstart",()=>{follow=false;$("bCen").classList.remove("on")});
  $("bLay").onclick=()=>{setLayer(lay+1);toast("Mapa: "+CAMADAS[lay].n)};
  $("bFull").onclick=()=>{const w=$("mapWrap"),f=w.classList.toggle("full");$("bFull").textContent=f?"✕":"⤢";document.body.style.overflow=f?"hidden":"";setTimeout(()=>map.invalidateSize(),60)};
  $("bZi").onclick=()=>map.zoomIn();
  $("bZo").onclick=()=>map.zoomOut();
  $("bCen").onclick=()=>{
    if(tracking&&layers.moto){follow=true;$("bCen").classList.add("on");map.setView(layers.moto.getLatLng(),16,{animate:true})}
    else map.setView([me.lat,me.lng],15,{animate:true});
  };
  if(!tracking)map.on("click",async e=>{
    const{lat,lng}=e.latlng;
    const info=$("info");if(info)info.textContent="Buscando endereço…";
    let end="Local no mapa";
    try{const r=await(await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=pt-BR&lat=${lat}&lon=${lng}`)).json();
      if(r&&r.display_name)end=r.display_name.split(",").slice(0,3).join(",").trim()}catch(e){}
    definirDestino(lat,lng,end);
  });
}
async function rotaReal(a,b){
  try{
    const r=await (await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`)).json();
    const t=r.routes[0];
    return{km:t.distance/1000,min:Math.max(1,Math.round(t.duration/60)),pts:t.geometry.coordinates.map(c=>[c[1],c[0]])};
  }catch(e){return{km:hav(a.lat,a.lng,b.lat,b.lng),min:0,pts:[[a.lat,a.lng],[b.lat,b.lng]]}}
}
/* rota completa: origem → paradas… → destino (com trechos) */
async function rotaCompleta(pontos){
  try{
    const coords=pontos.map(p=>p.lng+","+p.lat).join(";");
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`);
    const j=await r.json(),t=j.routes[0];
    if(!t)throw 0;
    return{km:t.distance/1000,min:Math.max(1,Math.round(t.duration/60)),pts:t.geometry.coordinates.map(c=>[c[1],c[0]]),
      legs:t.legs.map(lg=>({km:lg.distance/1000,min:Math.max(1,Math.round(lg.duration/60))}))};
  }catch(e){
    let km=0,pts=[[pontos[0].lat,pontos[0].lng]];
    const legs=[];
    for(let i=1;i<pontos.length;i++){const d=hav(pontos[i-1].lat,pontos[i-1].lng,pontos[i].lat,pontos[i].lng);km+=d;legs.push({km:d,min:Math.max(1,Math.round(d*2))});pts.push([pontos[i].lat,pontos[i].lng])}
    return{km,min:Math.max(1,Math.round(km*2)),pts,legs};
  }
}
function desenhar(){
  ["line","glow","flag","stops"].forEach(k=>{if(layers[k]){map.removeLayer(layers[k]);delete layers[k]}});
  if(tracking)layers.line=L.polyline(rota.pts,{color:"#9aa3ab",weight:4,dashArray:"6 8",opacity:.85}).addTo(map);
  else{
    layers.glow=L.polyline(rota.pts,{color:"#ff7a1a",weight:12,opacity:.25,lineCap:"round"}).addTo(map);
    layers.line=L.polyline(rota.pts,{color:"#ff7a1a",weight:5,opacity:.95,lineCap:"round",lineJoin:"round"}).addTo(map);
  }
  const paradas=stops.filter(s=>s.lat!=null);
  if(!tracking&&paradas.length){
    layers.stops=L.layerGroup(paradas.map((s,i)=>L.marker([s.lat,s.lng],{icon:icoStop}).bindTooltip("Parada "+(i+1),{direction:"top",offset:[0,-24]}))).addTo(map);
  }
  layers.flag=L.marker([dest.lat,dest.lng],{icon:icoFlag}).addTo(map);
  map.fitBounds(layers.line.getBounds().extend([me.lat,me.lng]),{padding:[40,40]});
}
function mover(p){
  if(!layers.moto){layers.moto=L.marker(p,{icon:icoArrow,zIndexOffset:1000}).addTo(map);return}
  const a=layers.moto.getLatLng(),t0=performance.now(),el=layers.moto.getElement();
  if(el&&hav(a.lat,a.lng,p[0],p[1])>.005)el.firstChild.style.transform="rotate("+brg([a.lat,a.lng],p)+"deg)";
  if(follow)map.panTo(p,{animate:true,duration:1.2});
  cancelAnimationFrame(anim);
  const f=t=>{const k=Math.min(1,(t-t0)/1500);layers.moto.setLatLng([a.lat+(p[0]-a.lat)*k,a.lng+(p[1]-a.lng)*k]);if(k<1)anim=requestAnimationFrame(f)};
  anim=requestAnimationFrame(f);
}
async function rotaMoto(m){
  if(rmBusy||!dest)return;
  if(rmFrom&&hav(m.lat,m.lng,rmFrom[0],rmFrom[1])<.1)return;
  rmBusy=true;
  const r=await rotaReal({lat:+m.lat,lng:+m.lng},dest);
  rmBusy=false;
  if(!map)return;
  rmFrom=[+m.lat,+m.lng];
  if(layers.rm){layers.rm.setLatLngs(r.pts);layers.rmG.setLatLngs(r.pts)}
  else{
    layers.rmG=L.polyline(r.pts,{color:"#ff7a1a",weight:12,opacity:.25,lineCap:"round"}).addTo(map);
    layers.rm=L.polyline(r.pts,{color:"#ff7a1a",weight:5,opacity:.95,lineCap:"round",lineJoin:"round"}).addTo(map);
  }
  const i=$("mInfo");if(i){i.innerHTML=`<b>${r.km.toFixed(1)} km</b>${r.min?` · ~${r.min} min`:""} até o destino`;i.style.display="block"}
}
async function etaBusca(m){
  if(etaBusy||!me.lat)return;
  if(etaFrom&&hav(m.lat,m.lng,etaFrom[0],etaFrom[1])<.1)return;
  etaBusy=true;
  try{
    const r=await rotaReal({lat:+m.lat,lng:+m.lng},{lat:me.lat,lng:me.lng});
    etaFrom=[+m.lat,+m.lng];
    const el=$("etaTxt");if(el)el.textContent="🏍️ Chega em ~"+Math.max(1,Math.round(r.min))+" min";
  }catch(e){}
  etaBusy=false;
}

let sugT=null,sugSeq=0,sugFor="q";
const RECENTES=()=>{try{return JSON.parse(LS("recentes")||"[]")}catch(e){return[]}};
function salvaRecente(d){const r=RECENTES().filter(x=>x.end!==d.end);r.unshift({end:d.end,lat:d.lat,lng:d.lng});localStorage.setItem("recentes",JSON.stringify(r.slice(0,5)))}
function fechaSug(){const e=$("sug");if(e){e.style.display="none";e.innerHTML=""}}
function mostraSug(l,titulo){
  const e=$("sug");if(!e)return;
  if(!l.length){fechaSug();return}
  e.innerHTML=(titulo?'<div class="k" style="padding:10px 14px 2px">'+titulo+'</div>':"")+l.map((x,i)=>`<div class="sg" data-i="${i}"><b>📍 ${esc(x.t)}</b><span>${esc(x.s)}</span></div>`).join("");
  e.style.display="block";
  e.querySelectorAll(".sg").forEach(el=>el.onclick=()=>{
    const x=l[+el.dataset.i];fechaSug();
    if(sugFor==="q"){$("q").value=x.t;definirDestino(x.lat,x.lng,x.end)}
    else{const i=+sugFor.replace("stop","");stops[i]={end:x.end,lat:x.lat,lng:x.lng};renderStops();recalc()}
  });
}
function mostraRecentes(){mostraSug(RECENTES().map(x=>({t:x.end.split(",")[0],s:x.end.split(",").slice(1).join(",").trim(),lat:x.lat,lng:x.lng,end:x.end})),"🕘 Recentes")}
async function sugerir(q){
  const my=++sugSeq;
  try{
    const r=await(await fetch("https://photon.komoot.io/api/?limit=10&location_bias_scale=0.6&lat="+me.lat+"&lon="+me.lng+"&q="+encodeURIComponent(q))).json();
    if(my!==sugSeq)return;
    const l=(r.features||[]).filter(f=>f.properties.countrycode==="BR").slice(0,5).map(f=>{
      const p=f.properties,num=p.housenumber?", "+p.housenumber:"";
      const t=p.name&&p.name!==p.street?p.name:(p.street?p.street+num:"Local");
      const s=[p.name&&p.street&&p.name!==p.street?p.street+num:"",p.district,p.city||p.county,p.state].filter(Boolean).join(", ");
      return{t,s,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],end:t+(s?", "+s:"")};
    });
    if(l.length)mostraSug(l);else fechaSug();
  }catch(e){if(my===sugSeq)fechaSug()}
}

/* ====== TARIFAS ESTILO UBER ====== */
let opts=[],selOpt=0,promoFator=1,promoCod="";
const MAXP=2;
function calcOpts(l){
  if(!l.length||!rota)return[];
  const km=rota.km,surge=l.length<=2?1.2:1;
  const eta=d=>Math.max(2,Math.round(d*2));
  const near=l.slice().sort((a,b)=>a.d-b.d)[0];
  const cheap=l.slice().sort((a,b)=>a.preco_km-b.preco_km)[0];
  const avg=l.reduce((t,m)=>t+ +m.preco_km,0)/l.length;
  const mid=l.slice().sort((a,b)=>Math.abs(a.preco_km-avg)-Math.abs(b.preco_km-avg))[0];
  const mk=(nome,ico,desc,m,fator)=>({nome,ico,desc,m,preco:+(km*m.preco_km*fator*surge).toFixed(2),eta:eta(m.d),surge});
  return[mk("Flash Rápida","🚀","O mais próximo de você",near,1.10),
         mk("Flash","🛵","Bom preço, boa espera",mid,1.00),
         mk("Flash Econômica","⚡","Menor preço da região",cheap,1.00)];
}
function routeChipsHtml(){
  const paradas=stops.filter(s=>s.lat!=null);
  const pts=["📍 Você",...paradas.map((s,i)=>"⏸️ Parada "+(i+1)),"🏁 "+curta(dest.end,22)];
  return `<div class="routeChips">${pts.map((p,i)=>`<span class="rcPill">${esc(p)}</span>${i<pts.length-1?'<span class="rcArrow">→</span>':""}`).join("")}</div>`;

  b.innerHTML=`
    <div class="row"><div><b style="font-size:17px">Escolha sua corrida</b><div class="k">🛣️ ${rota.km.toFixed(1)} km · 🕐 ~${rota.min} min${nParadas?` · 🧭 ${nParadas+1} pontos`:""}</div></div>
    <button class="btn ghost sm" id="shTrocar" style="min-height:38px">Trocar</button></div>
    ${routeChipsHtml()}
    ${surge?'<div class="surge">⚡ Demanda alta na região · tarifa x1,2</div>':""}
    <div style="margin-top:6px">${opts.map((o,i)=>`
      <div class="opt ${i===selOpt&&!custom?"on":""}" data-i="${i}">
        <span class="oi">${o.ico}</span>

        <span class="oe"><b>${brl(precoFinal(i))}</b><span>${custom?"você ofereceu":"preço final"}</span></span>
      </div>`).join("")}
    </div>
    <div class="grid2" style="margin-top:10px">
      <div><label class="lbl">💬 Oferecer outro valor (opcional)</label><input id="oferta" type="number" step="0.5" min="1" inputmode="decimal" placeholder="Ex.: 12,00" value="${esc(LS("oferta_v")||"")}"></div>
      <div><label class="lbl">🎟️ Código promocional</label><input id="promo" placeholder="STEVE10" value="${esc(promoCod)}"></div>
    </div>
    <label class="lbl" style="margin-top:10px">💳 Pagamento</label>
    <select id="pagSel" style="min-height:48px">
      <option ${LS("pag")==="Dinheiro"?"selected":""}>Dinheiro</option>
      <option ${LS("pag")==="Pix"?"selected":""}>Pix</option>
    </select>
    <button class="btn big" id="confirma" style="margin-top:14px">🚀 Pedir ${esc(opts[selOpt].nome)} · <span id="confVl">${brl(precoFinal(selOpt))}</span></button>
    <div class="k" style="text-align:center;margin-top:8px">${ultima.length} motoboy${ultima.length===1?"":"s"} online${promoFator<1?` · 🎟️ ${esc(promoCod)} aplicado (−${Math.round((1-promoFator)*100)}%)`:""} · preço sobre o km total da rota</div>`;
  $("sheet").classList.add("on");
  $("shTrocar").onclick=()=>{$("sheet").classList.remove("on");$("q").focus()};
  b.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{selOpt=+el.dataset.i;renderSheet()});
  $("oferta").oninput=()=>{localStorage.setItem("oferta_v",$("oferta").value);renderSheet()};
  $("promo").onchange=()=>{
    const c=$("promo").value.trim().toUpperCase();promoCod=c;
    if(!c){promoFator=1;renderSheet();return}
    if(c==="STEVE10")promoFator=0.9;
    else if(c==="BEMVINDO"&&!LS("ja_correu"))promoFator=0.85;
    else{promoFator=1;toast(c==="BEMVINDO"?"Código só vale na 1ª corrida":"Código inválido")}
    renderSheet();
  };
  $("pagSel").onchange=()=>{localStorage.setItem("pag",$("pagSel").value);toast("Pagamento: "+$("pagSel").value)};
  $("confirma").onclick=()=>{
    const o=opts[selOpt],vl=precoFinal(selOpt);
    localStorage.setItem("oferta",custom?"1":"0");
    if(!custom&&promoFator<1)localStorage.setItem("promo_fator",promoFator);else localStorage.removeItem("promo_fator");
    if(!custom&&promoCod)localStorage.setItem("promo_cod",promoCod);else localStorage.removeItem("promo_cod");
    localStorage.setItem("auto","1");
    localStorage.setItem("tentados",JSON.stringify([String(o.m.id)]));
    chamar(o.m,vl,$("confirma"));
  };
}
async function recalc(){
  if(!dest||!me.lat)return;
  const info=$("info");
  if(info)info.textContent="Traçando rota…";
  const paradas=stops.filter(s=>s.lat!=null);
  rota=await rotaCompleta([{lat:me.lat,lng:me.lng},...paradas,dest]);
  desenhar();
  if(info)info.innerHTML=`🧭 ${rota.legs.length} trecho${rota.legs.length>1?"s":""} · 🛣️ ${rota.km.toFixed(1)} km total · 🕐 ~${rota.min} min${paradas.length?` · ${paradas.length} parada${paradas.length>1?"s":""}`:""}`;
  opts=calcOpts(ultima);renderSheet();
}
async function definirDestino(lat,lng,end){
  dest={lat,lng,end};fechaSug();salvaRecente(dest);
  await recalc();
  listar();
}

  }

  box.innerHTML=l.slice(0,3).map(m=>`<div class="card"><div class="row"><div><b>🏍️ ${esc(m.nome)}</b><div class="k">a ${m.d.toFixed(1)} km de você · ${brl(m.preco_km)}/km${rota?" · "+brl(rota.km*m.preco_km):""}</div></div><span class="pill ok">online</span></div></div>`).join("")+(l.length>3?`<div class="k" style="text-align:center">+ ${l.length-3} motoboy${l.length-3>1?"s":""} online</div>`:"");
}

/* ====== CRIAR CORRIDA (com fallback sem colunas novas) ====== */
async function postCorrida(body){
  try{return await api("corridas",{method:"POST",body:JSON.stringify(body)})}
  catch(e){
    if("origem_lat" in body&&/origem|parada|column|42703/i.test(e.message)){
      delete body.origem_end;delete body.origem_lat;delete body.origem_lng;delete body.paradas;
      toast("Modo compatível: paradas sem salvamento no banco");
      return await api("corridas",{method:"POST",body:JSON.stringify(body)});
    }
    throw e;
  }
}
async function chamar(m,vl,btn){
  const nome=$("nome")?$("nome").value.trim():LS("cli_nome"),tel=$("tel")?$("tel").value.trim():LS("cli_tel");
  if(!nome){toast("Informe seu nome");mostrarTab("conta");return}
  localStorage.setItem("cli_nome",nome);localStorage.setItem("cli_tel",tel);localStorage.setItem("ja_correu","1");
  btn.disabled=true;btn.textContent="Chamando…";
  try{
    const paradas=stops.filter(s=>s.lat!=null);
    const body={motoboy_id:m.id,cliente_nome:nome,cliente_tel:tel,destino_end:dest.end,destino_lat:dest.lat,destino_lng:dest.lng,distancia_km:+rota.km.toFixed(2),valor:+vl.toFixed(2),status:"pendente",
      origem_end:"Localização atual do cliente",origem_lat:me.lat,origem_lng:me.lng,
      paradas:paradas.length?JSON.stringify(paradas):undefined};
    const r=await postCorrida(body);
    localStorage.setItem("corrida_id",r[0].id);
    acompanhar();
  }catch(e){
    if(/uma_corrida_ativa|23505/.test(e.message)){
      try{const a=await api("corridas?status=in.(pendente,proposta,aceita,a_caminho)&select=id&limit=1");if(a[0]){localStorage.setItem("corrida_id",a[0].id);toast("Você já tem uma corrida em andamento");acompanhar();return}}catch(x){}
    }
    toast("Erro: "+e.message);btn.disabled=false;btn.textContent="Pedir agora";
  }
}

const ST={pendente:["⏳ Procurando motoboy…","warn"],proposta:["💬 Proposta recebida","warn"],aceita:["✅ Motoboy a caminho","ok"],a_caminho:["🏍️ Corrida em andamento","ok"],concluida:["🏁 Corrida concluída","ok"],recusada:["✖ O motoboy recusou","bad"],cancelada:["Pedido cancelado","bad"]};
function stepStatus(s){return s==="concluida"?4:s==="a_caminho"?3:s==="aceita"?2:1}
function stopsHtmlCli(c){

function acompanhar(){

  initMap();
  let lastSt=null,fit=false,telM=null;
  const tick=async()=>{
    let c,m=null;

    if(!$("st"))return;
    if(LS("auto")==="1"&&(c.status==="recusada"||(c.status==="pendente"&&!(+c.rodada>0)&&!(+c.rodada_cli>0)&&Date.now()-new Date(c.criado_em).getTime()>45000))){
      if(c.status==="pendente")await api("corridas?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"cancelada",atualizado_em:new Date().toISOString()}),prefer:"return=minimal"}).catch(()=>{});

    }
    if(!dest){
      dest={lat:+c.destino_lat,lng:+c.destino_lng,end:c.destino_end};
      const paradas=normParadas(c);
      rota=await rotaCompleta([{lat:me.lat,lng:me.lng},...paradas,dest]);
      desenhar();
    }
    try{m=(await api("motoboys?id=eq."+encodeURIComponent(c.motoboy_id)+"&select=id,nome,preco_km,lat,lng,atualizado_em,placa,veiculo,cor"))[0]}catch(e){}
    if(!telM&&["aceita","a_caminho"].includes(c.status)){try{telM=await api("rpc/telefone_motoboy",{method:"POST",body:JSON.stringify({p_corrida:c.id})})}catch(e){}}

      if(pr.dataset.k!==k){
        pr.dataset.k=k;
        pr.innerHTML=`<div class="card" style="border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card));margin:12px 0 0"><div class="k">💬 Proposta do motoboy (${+c.rodada||1} de 3)</div><div class="val" style="font-size:32px">${brl(c.contra_valor)}</div><div class="k">Seu pedido: ${brl(c.valor)}</div><div class="grid2" style="margin-top:12px"><button class="btn" id="pAc">✅ Aceitar</button><button class="btn ghost" id="pRe">✖ Recusar</button></div>${+c.rodada_cli<3?`<button class="btn ghost" id="pCt" style="margin-top:8px">💬 Contrapropor (${3-(+c.rodada_cli||0)} restante${3-(+c.rodada_cli||0)>1?"s":""})</button><div id="pCtBox" style="display:none;margin-top:8px"><input id="pCtV" type="number" step="0.5" min="1" inputmode="decimal"><button class="btn" id="pCtGo" style="margin-top:8px">📨 Enviar contraproposta</button></div>`:""}</div>`;

      }
    }else{pr.innerHTML="";pr.dataset.k=""}

    $("dt").innerHTML=`<div class="k">📍 ${esc(c.destino_end||"")}</div><div class="k">${(+c.distancia_km).toFixed(1)} km · 💳 ${esc(LS("pag")||"Dinheiro")} ${wa}</div>`;

        ${m.telefone?`<a class="icobtn" target="_blank" rel="noopener" href="https://wa.me/${soDig(m.telefone)}">💬 Mensagem</a>`:""}
        ${m.telefone?`<a class="icobtn" href="tel:${soDig(m.telefone)}">📞 Ligar</a>`:""}

        if(c.status!=="pendente")rotaMoto(m);
      }
    }else $("drv").innerHTML="";
    if(c.status!==lastSt){
      lastSt=c.status;
      const term=["concluida","recusada","cancelada"].includes(c.status);
      if(term)limparRotaMoto();
      $("ac").innerHTML=term?acFim(c,id):'<button class="btn bad" id="canc">Cancelar pedido</button>';
      if(term){clearInterval(poller);guardarHist(c);ligarEstrelas(id);$("nova").onclick=()=>{localStorage.removeItem("corrida_id");promoFator=1;promoCod="";mostrarTab("home")}}
      else $("canc").onclick=async()=>{
        $("canc").disabled=true;localStorage.setItem("auto","0");
        try{await api("corridas?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"cancelada",atualizado_em:new Date().toISOString()}),prefer:"return=minimal"});toast("Pedido cancelado");tick()}
        catch(e){toast("Erro: "+e.message);$("canc").disabled=false}
      };
    }
  };
  tick();
  poller=setInterval(tick,4000);
}

function compartilhar(c,m){

async function contraproposta(id,c){
  const v=Math.round((+$("pCtV").value)*100)/100;
  if(!(v>0)||v>(+c.contra_valor)*3){toast("Informe um valor válido");return}
  if(v===+c.contra_valor){toast("Para esse valor, toque em Aceitar");return}
  $("pCtGo").disabled=true;
  try{
    await api("corridas?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"pendente",valor:v,contra_valor:null,rodada_cli:(+c.rodada_cli||0)+1,atualizado_em:new Date().toISOString()}),prefer:"return=minimal"});
    localStorage.setItem("oferta","1");toast("Contraproposta enviada ✓");$("prop").innerHTML="";
  }catch(e){toast("Erro: "+e.message);$("pCtGo").disabled=false}
}
async function responderProposta(id,c,ok){
  document.querySelectorAll("#pAc,#pRe").forEach(b=>b.disabled=true);
  const body=ok?{valor:+c.contra_valor,status:"aceita"}:{status:"pendente",contra_valor:null};
  body.atualizado_em=new Date().toISOString();
  try{
    await api("corridas?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify(body),prefer:"return=minimal"});
    toast(ok?"Proposta aceita ✓":(+c.rodada<3?"Proposta recusada. O motoboy pode negociar de novo.":"Proposta recusada."));
    $("prop").innerHTML="";
  }catch(e){toast("Erro: "+e.message);document.querySelectorAll("#pAc,#pRe").forEach(b=>b.disabled=false)}
}
async function reenviar(c){
  if(reenviando)return;reenviando=true;
  try{
    const t=JSON.parse(LS("tentados")||"[]"),lim=Date.now()-10*60000;
    let l=await api("motoboys?online=eq.true&select=id,nome,preco_km,lat,lng,atualizado_em");
    l=l.filter(m=>m.lat!=null&&m.lng!=null&&!t.includes(String(m.id))&&(!m.atualizado_em||new Date(m.atualizado_em).getTime()>lim));
    l.forEach(m=>m.d=hav(me.lat,me.lng,m.lat,m.lng));l.sort((a,b)=>a.d-b.d);
    const m=l[0];
    if(!m){localStorage.setItem("auto","0");toast("Nenhum motoboy disponível agora");return}
    t.push(String(m.id));localStorage.setItem("tentados",JSON.stringify(t));
    const paradas=normParadas(c);
    const body={motoboy_id:m.id,cliente_nome:c.cliente_nome,cliente_tel:c.cliente_tel,destino_end:c.destino_end,destino_lat:c.destino_lat,destino_lng:c.destino_lng,distancia_km:c.distancia_km,
      valor:LS("oferta")==="1"?+c.valor:+(c.distancia_km*m.preco_km).toFixed(2),status:"pendente"};
    if(c.origem_lat!=null){body.origem_end=c.origem_end;body.origem_lat=c.origem_lat;body.origem_lng=c.origem_lng}
    if(paradas.length)body.paradas=JSON.stringify(paradas);
    const r=await postCorrida(body);
    localStorage.setItem("corrida_id",r[0].id);dest=null;toast("Procurando outro motoboy…");acompanhar();
  }catch(e){}finally{reenviando=false}
}
function ligarEstrelas(id){

    catch(e){toast("Não foi possível enviar a nota")}
  });
}
function guardarHist(c){
  if(c.status!=="concluida")return;
  const h=JSON.parse(LS("hist")||"[]");if(h.some(x=>x.id===c.id))return;
  h.unshift({id:c.id,end:c.destino_end,valor:c.valor,km:c.distancia_km,data:c.atualizado_em||new Date().toISOString(),lat:c.destino_lat,lng:c.destino_lng});
  localStorage.setItem("hist",JSON.stringify(h.slice(0,20)));
}

  };
}

/* ====== START ====== */
function start(){
  $("tabbar").style.display="flex";
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.tab==="home"));
  LS("corrida_id")?acompanhar():home();
}
function vigiar(){
  navigator.geolocation.watchPosition(p=>{
    me.lat=p.coords.latitude;me.lng=p.coords.longitude;
    if(map&&layers.me){const ll=[me.lat,me.lng];layers.me.setLatLng(ll);layers.acc.setLatLng(ll).setRadius(Math.min(p.coords.accuracy||0,150))}
  },null,{enableHighAccuracy:true,maximumAge:5000});
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{me.lat=p.coords.latitude;me.lng=p.coords.longitude;start();vigiar()},()=>{toast("Ative a localização para ver motoboys perto de você");start()},{enableHighAccuracy:true,timeout:10000});
}else start();
</script>
