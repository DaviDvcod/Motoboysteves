<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF7A1A">
<title>STEVEDRIVE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#14171a;--card:#1e2226;--card2:#262b30;--tx:#f2f2f0;--mut:#9aa3ab;--acc:#ff7a1a;--acc2:#ffb300;--ok:#33c17a;--bad:#ff5c5c;--bd:#31363b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:9px}
.logo .mk{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#ff8a2b,#ff6a00);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 3px 10px rgba(255,106,0,.4)}
.logo b{font-size:19px;letter-spacing:-.02em}
.logo b span{color:var(--acc)}
.hdrPill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}
.hdrPill.on{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.hdrPill.off{background:var(--card2);color:var(--mut)}
main{max-width:520px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 92px)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ct{font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.k{color:var(--mut);font-size:12.5px}
.v{font-size:24px;font-weight:700;letter-spacing:-.02em}
input,select{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card2);color:var(--tx);font:inherit;outline:none}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
label.lbl{font-size:13px;font-weight:600;color:var(--mut);display:block;margin:2px 0 6px}
.btn{border:0;background:linear-gradient(135deg,#ff8a2b,#ff6a00);color:#1a1204;min-height:50px;padding:12px 20px;border-radius:14px;font-size:15.5px;font-weight:700;cursor:pointer;width:100%;transition:transform .12s,filter .12s,opacity .2s}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.ok{background:var(--ok);color:#06210f}
.btn.bad{background:var(--bad);color:#2a0000}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn.big{min-height:56px;font-size:17px;border-radius:16px}
.btn:disabled{opacity:.55}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{position:relative;width:54px;height:30px;border-radius:20px;background:var(--card2);border:1px solid var(--bd);cursor:pointer;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.2s}
.sw.on{background:color-mix(in srgb,var(--ok) 30%,var(--card2))}
.sw.on i{left:27px;background:var(--ok)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--acc2) 18%,transparent);color:var(--acc2);animation:pl 1.6s ease-in-out infinite}
.pill.info{background:color-mix(in srgb,#2f7cf6 18%,transparent);color:#7aaef7}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.sec{font-weight:700;font-size:15px;margin:16px 2px 10px;border-left:3px solid var(--acc);padding-left:9px;display:flex;align-items:center;gap:6px}
#mapWrap{position:relative;margin-top:10px}
#map{height:280px;border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:#0d0f11}
#map.dk .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
#mapWrap.full{position:fixed;inset:0;z-index:2000;margin:0}
#mapWrap.full #map{height:100%;border-radius:0;border:0}
.mb{position:absolute;right:10px;z-index:1000;width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:19px;cursor:pointer;box-shadow:0 2px 8px #0006;padding:0}
#mapWrap.full .mb{margin-top:env(safe-area-inset-top,0px)}
#bFull{top:10px}#bLay{top:62px}#bCen{top:114px;display:none}#bCen.on{display:block;color:var(--acc)}
#bZi{top:166px;font-size:22px;font-weight:700}#bZo{top:218px;font-size:22px;font-weight:700}
#bHeat{top:270px}
#bHeat.on{color:#ff4d00;border-color:#ff4d00}
#mInfo{position:absolute;left:10px;right:64px;bottom:10px;z-index:1000;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font-size:13px;display:none;box-shadow:0 2px 8px #0006}
#mapWrap.full #mInfo{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
#mInfo b{color:var(--acc2);font-size:15px}
#mSpd{position:absolute;left:10px;top:10px;z-index:1000;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;font-weight:800;font-size:15px;display:none}
#mapWrap.full #mSpd{margin-top:env(safe-area-inset-top,0px)}
#mSpd small{font-size:10px;color:var(--mut);font-weight:600}
.me{width:34px;height:34px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 7px rgba(255,122,26,.25),0 2px 8px #0009;display:flex;align-items:center;justify-content:center;color:#1a1204;font-size:15px;transition:transform .4s}
.pin{font-size:28px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.empty{color:var(--mut);text-align:center;padding:28px 10px;font-size:14px}
.req{border:1px solid var(--acc);border-radius:16px;padding:16px;margin-bottom:12px;background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.req .val{font-size:28px;font-weight:800;color:var(--acc2)}
a.wa{color:var(--ok);text-decoration:none;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stopList{margin-top:10px;border-top:1px dashed var(--bd);padding-top:8px}
.stopItem{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.stopItem.done{color:var(--mut);text-decoration:line-through}
.stopItem.cur{font-weight:700}
.stopItem.cur .sd{background:var(--acc);color:#1a1204;border-color:var(--acc)}
.sd{width:22px;height:22px;border-radius:50%;background:var(--card2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
/* ALERTA */
#alerta{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:24px;background:#ff7a1a;animation:pisca .9s infinite alternate;overflow-y:auto}
#alerta.on{display:flex}
@keyframes pisca{from{background:#ff7a1a}to{background:#ff4d00}}
@media (prefers-reduced-motion:reduce){#alerta{animation:none}}
.alBox{width:100%;max-width:420px;text-align:center;color:#1a1204}
.alTit{font-size:30px;font-weight:800}
.alVal{font-size:56px;font-weight:900;margin:6px 0}
.alSub{font-size:16px;font-weight:600}
.alDest{font-size:18px;margin:8px 0 10px}
.tl{display:flex;margin:12px 0 4px}
.tl .st{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--mut);font-weight:600}
.tl .st i{display:block;width:12px;height:12px;border-radius:50%;background:var(--bd);margin:0 auto 5px}
.tl .st.on{color:var(--ok)}
.tl .st.on i{background:var(--ok)}
.tl .st:not(:last-child)::before{content:"";position:absolute;top:6px;left:calc(50% + 9px);right:calc(-50% + 9px);height:2px;background:var(--bd)}
.tl .st.on:not(:last-child)::before{background:var(--ok)}
.metaBar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:8px}
.metaBar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a2b,#ffb300);border-radius:6px;transition:width .5s}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sgrid .sc{background:var(--card2);border-radius:14px;padding:12px}
.sgrid .sc b{font-size:20px;display:block}
.sgrid .sc span{font-size:11.5px;color:var(--mut);font-weight:600}
/* CHAT */
.chat{margin-top:12px;border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.chat .ch{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card2);font-weight:700;font-size:13.5px;border-bottom:1px solid var(--bd)}
.chat .ch .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
#chatBox{max-height:170px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.35}
.msg.eu{align-self:flex-end;background:var(--acc);color:#1a1204;border-bottom-right-radius:4px;font-weight:600}
.msg.ele{align-self:flex-start;background:var(--card2);border:1px solid var(--bd);border-bottom-left-radius:4px}
.mh{display:block;font-size:10px;opacity:.7;margin-top:2px;text-align:right}
.chatInRow{display:flex;gap:8px;padding:8px;background:var(--card);border-top:1px solid var(--bd)}
.chatInRow input{min-height:44px;border-radius:22px}
.chatInRow button{width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;font-size:18px;flex:none}
/* avaliações recebidas */
.avl{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}
.avl:last-child{border:0}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:900;display:none;background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabbar button{flex:1;background:none;border:0;padding:9px 4px 7px;color:var(--mut);font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabbar button.on{color:var(--acc)}
#tabbar .ico{font-size:21px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:4000;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(255,122,26,.45),0 2px 8px rgba(0,0,0,.6)}100%{box-shadow:0 0 0 16px rgba(255,122,26,0),0 2px 8px rgba(0,0,0,.6)}}
.me{animation:pu 2s ease-out infinite}
.pill.warn{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.me,.pill.warn,.chat .ch .dot{animation:none}}
.leaflet-bottom.leaflet-left{margin-bottom:46px}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="mk">🏍️</div><b>STEVE<span>DRIVE</span></b></div>
  <span class="hdrPill off" id="hdrSt">offline</span>
</header>
<main id="app"></main>
<div id="alerta"><div class="alBox"><div class="alTit">🏍️ Nova corrida!</div><div class="alVal" id="alVal"></div><div class="alSub" id="alKm"></div><div class="alDest" id="alDest"></div><div id="alDet" class="alSub" style="margin-bottom:14px"></div><div style="height:8px;background:#1a120433;border-radius:6px;margin:0 0 18px;overflow:hidden"><div id="alBarI" style="height:100%;width:100%;background:#1a1204;transition:width 1s linear"></div></div><button class="btn ok" id="alAc">✅ Aceitar</button><button class="btn ghost" id="alNeg" style="margin-top:10px;color:#1a1204;border-color:#1a1204"></button><div id="alNegBox" style="display:none;margin-top:12px"><input id="alNegV" type="number" step="0.5" min="1" inputmode="decimal" style="text-align:center;font-size:24px;font-weight:800;color:#1a1204;background:#fff"><button class="btn ok" id="alNegGo" style="margin-top:10px">📨 Enviar proposta</button></div><button class="btn ghost" id="alRe" style="margin-top:10px;color:#1a1204;border-color:#1a1204">✖ Recusar</button></div></div>
<div id="toast"></div>
<div id="tabbar">
  <button data-tab="painel"><span class="ico">🏠</span>Painel</button>
  <button data-tab="ganhos"><span class="ico">💰</span>Ganhos</button>
  <button data-tab="perfil"><span class="ico">👤</span>Perfil</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>
<script>
"use strict";
const SB="https://bkjywijgogeyekwgqawq.supabase.co",KEY="sb_publishable_v8SlYZngr9uQ0vpBxlPDPg_GBKN_-Or";
const $=id=>document.getElementById(id);
const uid=()=>(sessGet()||{}).user_id;
const brl=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const curta=(s,n=36)=>{s=String(s||"");return s.length>n?s.slice(0,n)+"…":s};
const fmtHora=d=>{d=new Date(d);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const LS=k=>localStorage.getItem(k);
let tToast=null;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tToast);tToast=setTimeout(()=>t.classList.remove("show"),2600)}
const AUTH=SB+"/auth/v1";
const sessGet=()=>{try{return JSON.parse(localStorage.getItem("sb_sess")||"null")}catch(e){return null}};
function sessSet(j){
  if(!j){localStorage.removeItem("sb_sess");return}
  const o=sessGet()||{};
  localStorage.setItem("sb_sess",JSON.stringify({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000+(j.expires_in||3600)),user_id:(j.user&&j.user.id)||o.user_id||null}));
}
function traduz(m){m=String(m||"");
  if(/invalid login/i.test(m))return"E-mail ou senha incorretos";
  if(/already registered/i.test(m))return"Esse e-mail já tem conta. Toque em Entrar";
  if(/at least|weak/i.test(m))return"Senha muito curta (mínimo 6 caracteres)";
  if(/not confirmed/i.test(m))return"Confirme seu e-mail antes de entrar";
  if(/rate limit/i.test(m))return"Muitas tentativas. Aguarde um pouco";
  if(/anonymous/i.test(m))return"Login anônimo desligado no Supabase";
  return m}
async function authCall(path,body){
  const r=await fetch(AUTH+path,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(traduz(j.msg||j.error_description||j.message||j.error||"erro "+r.status));e.http=true;throw e}
  return j;
}
let _tp=null;
function token(){
  const s=sessGet();
  if(s&&s.access_token&&s.expires_at>Date.now()/1000+60)return Promise.resolve(s.access_token);
  return _tp||(_tp=renovar().finally(()=>{_tp=null}));
}
async function renovar(){
  const s=sessGet();
  if(s&&s.refresh_token){
    try{const j=await authCall("/token?grant_type=refresh_token",{refresh_token:s.refresh_token});sessSet(j);return j.access_token}
    catch(e){if(!e.http)throw e;sessSet(null)}
  }
  return null;
}
function irLogin(){clearInterval(poller);try{stopWatch()}catch(e){}pararAlerta();sessSet(null);me=null;$("tabbar").style.display="none";loginScreen()}
async function api(path,opt={}){
  const tk=await token();
  if(!tk){irLogin();throw new Error("sem login")}
  const r=await fetch(SB+"/rest/v1/"+path,{...opt,headers:{apikey:KEY,Authorization:"Bearer "+tk,"Content-Type":"application/json",Prefer:opt.prefer||"return=representation",...(opt.headers||{})}});
  if(r.status===401){const s=sessGet();if(s){s.expires_at=0;localStorage.setItem("sb_sess",JSON.stringify(s))}}
  if(!r.ok)throw new Error("erro "+r.status+": "+(await r.text()).slice(0,160));
  return (r.headers.get("content-type")||"").includes("json")?r.json():null;
}
async function getMe(){
  try{const l=await api("motoboys?id=eq."+uid()+"&select=id,nome,telefone,preco_km,online,lat,lng,atualizado_em,placa,veiculo,cor");return l&&l[0]}
  catch(e){const l=await api("motoboys?id=eq."+uid()+"&select=id,nome,telefone,preco_km,online,lat,lng,atualizado_em");return l&&l[0]}
}
async function updMe(fields){return api("motoboys?id=eq."+uid(),{method:"PATCH",body:JSON.stringify(fields),prefer:"return=minimal"})}
const normParadas=c=>{if(!c||!c.paradas)return[];if(Array.isArray(c.paradas))return c.paradas;try{return JSON.parse(c.paradas)}catch(e){return[]}};

/* ====== PARADAS helpers ====== */
let avancoLocal={};
function paradaAtual(c){return c.parada_atual!=null?+c.parada_atual:(avancoLocal[c.id]||0)}
function waypointsOf(c){
  const paradas=normParadas(c),at=paradaAtual(c);
  if(c.status==="aceita"){
    if(c.origem_lat!=null)return[[+c.origem_lat,+c.origem_lng]];
    if(c.destino_lat!=null)return[[+c.destino_lat,+c.destino_lng]];
    return[];
  }
  if(c.status==="a_caminho"){
    const w=[];
    for(let i=at;i<paradas.length;i++)if(paradas[i]&&paradas[i].lat!=null)w.push([+paradas[i].lat,+paradas[i].lng]);
    if(c.destino_lat!=null)w.push([+c.destino_lat,+c.destino_lng]);
    return w;
  }
  if(c.destino_lat!=null)return[[+c.destino_lat,+c.destino_lng]];
  return[];
}
function alvoNome(c){
  const paradas=normParadas(c),at=paradaAtual(c);
  if(c.status==="aceita")return c.origem_end?("📍 Buscar cliente: "+c.origem_end):(c.destino_end||"Destino");
  if(c.status==="a_caminho")return at<paradas.length?("⏸️ Parada "+(at+1)+": "+paradas[at].end):("🏁 "+(c.destino_end||"Destino"));
  return c.destino_end||"Destino";
}
async function avancar(id,at){
  try{await api("corridas?id=eq."+id,{method:"PATCH",body:JSON.stringify({parada_atual:at+1,atualizado_em:new Date().toISOString()}),prefer:"return=minimal"})}
  catch(e){
    try{await api("corridas?id=eq."+id,{method:"PATCH",body:JSON.stringify({atualizado_em:new Date().toISOString()}),prefer:"return=minimal"})}
    catch(x){toast("Erro: "+x.message);return}
    avancoLocal[id]=at+1;
  }
  rKey="";
  toast("Parada concluída ✓ Avançando…");
  refreshPedidos();
}
function angDiff(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d}
function foraDirecao(c){
  if(!LS("dir_lat")||me.lat==null)return false;
  const wps=waypointsOf(c);
  if(!wps.length||c.destino_lat==null)return false;
  const dLat=+LS("dir_lat"),dLng=+LS("dir_lng");
  const r=x=>x*Math.PI/180;
  const ber=(a,b)=>{const dl=r(b[1]-a[1]),y=Math.sin(dl)*Math.cos(r(b[0])),x=Math.cos(r(a[0]))*Math.sin(r(b[0]))-Math.sin(r(a[0]))*Math.cos(r(b[0]))*Math.cos(dl);return(Math.atan2(y,x)*180/Math.PI+360)%360};
  const alvo=wps[wps.length-1];
  return angDiff(ber([me.lat,me.lng],[alvo[0],alvo[1]]),ber([me.lat,me.lng],[dLat,dLng]))>120;
}

/* ====== ONLINE / ACEITAÇÃO ====== */
function hojeKey(){return new Date().toISOString().slice(0,10)}
function onlineOn(){if(!LS("on_start"))localStorage.setItem("on_start",String(Date.now()))}
function onlineOff(){
  const st=+LS("on_start")||0;if(!st)return;
  const k="on_ms_"+hojeKey();
  localStorage.setItem(k,String((+LS(k)||0)+Date.now()-st));

function tempoOnlineHoje(){

  if(LS("on_start"))ms+=Date.now()-(+LS("on_start"));

}

async function ativarAlertas(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();await ac.resume()}catch(e){}
  let perm="denied";
  try{perm=await Notification.requestPermission()}catch(e){}
  apitar();if(navigator.vibrate)navigator.vibrate([300,150,300]);
  travarTela();
  const b=$("btnAl");if(b){b.textContent="✅ Ativo";b.disabled=true}
  toast(perm==="granted"?"Alertas ativados ✓":"Apito ativado. Para avisar fora do app, permita notificações no navegador.");
}
function apitar(){
  if(!ac)return;
  const t=ac.currentTime;
  for(let i=0;i<3;i++){
    const s0=t+i*.55,o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();
    o.type="sine";o.frequency.value=2500;l.frequency.value=40;lg.gain.value=110;
    l.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0,s0);g.gain.linearRampToValueAtTime(.7,s0+.03);g.gain.setValueAtTime(.7,s0+.38);g.gain.linearRampToValueAtTime(0,s0+.43);
    o.connect(g);g.connect(ac.destination);
    o.start(s0);l.start(s0);o.stop(s0+.45);l.stop(s0+.45);
  }
}
async function travarTela(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(me&&me.online)travarTela();refreshPedidos()}});
function pararAlerta(){clearInterval(alCd);clearInterval(alTm);alTm=null;alId=null;const a=$("alerta");if(a)a.classList.remove("on");if(navigator.vibrate)navigator.vibrate(0)}
function agFmt(c){
  if(!c.agendada_para)return null;
  const d=new Date(c.agendada_para);
  return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function agDentroDoHorario(c,min=20){
  if(!c.agendada_para)return true;
  return new Date(c.agendada_para).getTime()-Date.now()<=min*60000;
}
async function infoCorrida(c){
  const wps=waypointsOf(c);
  if(!wps.length)return"";
  const alvo={lng:wps[wps.length-1][1],lat:wps[wps.length-1][0]};
  let det="";
  if(me&&me.lat!=null){
    try{
      const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${me.lng},${me.lat};${alvo.lng},${alvo.lat}?overview=false`);
      const j=await r.json(),rt=j.routes&&j.routes[0];
      if(rt)det=`🛣️ ${(rt.distance/1000).toFixed(1)} km até ${c.status==="aceita"?"o cliente":"o próximo ponto"} · 🕐 ~${Math.max(1,Math.round(rt.duration/60))} min`;
    }catch(e){}
  }
  const paradas=normParadas(c);
  let extra=`💵 ${brl((+c.valor)/(+c.distancia_km||1))}/km`;
  if(paradas.length)extra+=` · 🧭 ${paradas.length+1} pontos`;
  if(c.troco_para)extra+=` · 💵 troco de ${brl(c.troco_para-c.valor)}`;
  if(c.passageiro_nome)extra+=` · 🎁 ${curta(c.passageiro_nome,14)}`;
  const agf=agFmt(c);
  if(agf)extra+=` · 🕐 saída ${agf}`;
  if(foraDirecao(c))extra+=" · ⚠️ FORA DA SUA DIREÇÃO";
  return det+(det?" · ":"")+extra;
}
async function mostrarAlerta(c){
  alId=c.id;

  };
  clearInterval(alTm);clearInterval(alCd);
  let sg=30;$("alBarI").style.width="100%";$("alRe").textContent="✖ Recusar (30s)";
  alCd=setInterval(()=>{sg--;$("alBarI").style.width=(sg/30*100)+"%";$("alRe").textContent="✖ Recusar ("+Math.max(sg,0)+"s)";if(sg<=0){clearInterval(alCd);responder(c.id,"recusada",false)}},1000);
  const ciclo=()=>{apitar();if(navigator.vibrate)navigator.vibrate([600,200,600,200,600])};
  ciclo();alTm=setInterval(ciclo,2600);
}
function notificar(c){
  if(!document.hidden||!("Notification" in window)||Notification.permission!=="granted")return;
  const paradas=normParadas(c);
  navigator.serviceWorker.ready.then(r=>r.showNotification("🏍️ Nova corrida! "+brl(c.valor),{body:(c.destino_end||"")+" · "+(+c.distancia_km).toFixed(1)+" km"+(paradas.length?" · "+(paradas.length+1)+" pontos":""),vibrate:[600,200,600,200,600,200,600],tag:"corrida-"+c.id,requireInteraction:true,icon:"icon-192.png"})).catch(()=>{});

let heatLayer=null,heatData=null,heatCache=0;
async function toggleHeat(){
  const btn=$("bHeat");

  btn.classList.add("on");

    const cells={};
    (l||[]).forEach(c=>{
      if(c.destino_lat==null)return;
      const k=(+c.destino_lat).toFixed(2)+","+(+c.destino_lng).toFixed(2);
      cells[k]=cells[k]||{lat:+c.destino_lat,lng:+c.destino_lng,n:0};
      cells[k].n++;
    });
    heatData=Object.values(cells);
    heatCache=Date.now();
    renderHeat();
  }catch(e){btn.classList.remove("on");toast("Demanda indisponível (rode o SQL de atualização)")}

  if(!map||!heatData)return;

  toast("🔥 Zonas com mais corridas (48h)");
}

const CAMADAS=[
  {n:"Escuro",gl:"https://tiles.openfreemap.org/styles/dark",dk:1,u:"https://tile.openstreetmap.org/{z}/{x}/{y}.png"},
  {n:"Ruas",gl:"https://tiles.openfreemap.org/styles/liberty"},
  {n:"Claro",gl:"https://tiles.openfreemap.org/styles/positron"},
  {n:"Satélite",u:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",z:18}
];
const MAN={left:"Vire à esquerda",right:"Vire à direita","slight left":"Curva leve à esquerda","slight right":"Curva leve à direita","sharp left":"Curva fechada à esquerda","sharp right":"Curva fechada à direita",straight:"Siga em frente",uturn:"Faça o retorno"};
let lay=+localStorage.getItem("moto_lay")||0,tile=null,accC=null,rLine=null,rGlow=null,dMark=null,pMarks=[];
let follow=true,rKey="",rFrom=null,rBusy=false;
const dist=(a,b,c,d)=>{const R=6371e3,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmtD=m=>m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(1)+" km";
function setLayer(i){
  lay=(i+CAMADAS.length)%CAMADAS.length;localStorage.setItem("moto_lay",lay);
  const c=CAMADAS[lay];let gl=false;
  if(tile)map.removeLayer(tile);
  tile=null;
  if(c.gl&&L.maplibreGL){try{tile=L.maplibreGL({style:c.gl,attribution:"© OpenFreeMap © OpenMapTiles Dados © OpenStreetMap"}).addTo(map);gl=true}catch(e){tile=null}}
  if(!tile)tile=L.tileLayer(c.u||"https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:c.z||19,maxNativeZoom:c.z||19,attribution:"© OpenStreetMap / Esri"}).addTo(map);
  if(tile.bringToBack)tile.bringToBack();
  $("map").classList.toggle("dk",!gl&&!!c.dk);
}
function initMap(){
  if(map){map.remove();map=null}
  rLine=rGlow=dMark=accC=null;pMarks=[];rKey="";rFrom=null;follow=true;heatLayer=null;
  const p=[me.lat||-27.816,me.lng||-50.326];
  map=L.map("map",{zoomControl:false,zoomSnap:.5,minZoom:3,preferCanvas:true}).setView(p,15);
  map.attributionControl.setPrefix(false);
  setLayer(lay);
  L.control.scale({imperial:false,position:"bottomleft"}).addTo(map);
  accC=L.circle(p,{radius:0,color:"#ff7a1a",weight:1,fillOpacity:.1,interactive:false}).addTo(map);
  marker=L.marker(p,{icon:L.divIcon({html:'<div class="me" id="meArr">▲</div>',className:"",iconSize:[34,34],iconAnchor:[17,17]}),zIndexOffset:1000}).addTo(map);
  map.on("dragstart",()=>{follow=false;$("bCen").classList.add("on")});
  $("bZi").onclick=()=>map.zoomIn();
  $("bZo").onclick=()=>map.zoomOut();
  $("bCen").onclick=()=>{follow=true;$("bCen").classList.remove("on");if(me.lat)map.setView([me.lat,me.lng],Math.max(map.getZoom(),16),{animate:true})};
  $("bLay").onclick=()=>{setLayer(lay+1);toast("Mapa: "+CAMADAS[lay].n)};
  $("bFull").onclick=()=>{

    $("bFull").textContent=f?"✕":"⤢";document.body.style.overflow=f?"hidden":"";

  if(me.online&&me.lat)$("mSpd").style.display="block";

function setPos(pos){
  const c=pos.coords;me.lat=c.latitude;me.lng=c.longitude;
  if(!map)return;
  const ll=[me.lat,me.lng];
  marker.setLatLng(ll);accC.setLatLng(ll).setRadius(Math.min(c.accuracy||0,150));
  const kmh=Math.max(0,(c.speed||0)*3.6);
  $("spdV").textContent=Math.round(kmh);$("mSpd").style.display="block";
  const a=$("meArr");if(a&&c.heading!=null&&!isNaN(c.heading)&&kmh>3)a.style.transform="rotate("+c.heading+"deg)";
  if(follow)map.panTo(ll,{animate:true,duration:.8});
}
function limparRota(){
  [rLine,rGlow,dMark].forEach(x=>x&&map.removeLayer(x));rLine=rGlow=dMark=null;rKey="";rFrom=null;
  const i=$("mInfo");if(i)i.style.display="none";
}
async function rota(c){
  if(rBusy||me.lat==null)return;
  const wps=waypointsOf(c);
  if(!wps.length)return;
  const key=c.id+":"+c.status+":"+paradaAtual(c),mudou=key!==rKey;
  if(!mudou&&rFrom&&dist(me.lat,me.lng,rFrom[0],rFrom[1])<100)return;
  rBusy=true;
  const paradas=normParadas(c),at=paradaAtual(c);
  const alvo=wps[0];
  try{
    const coords=`${me.lng},${me.lat};${wps.map(w=>w[1]+","+w[0]).join(";")}`;
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),9000);
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=true`,{signal:ctl.signal});
    clearTimeout(to);
    const j=await r.json(),rt=j.routes&&j.routes[0];
    if(!rt)throw 0;
    if(!map)return;
    const pts=rt.geometry.coordinates.map(p=>[p[1],p[0]]);
    if(rLine){rLine.setLatLngs(pts);rGlow.setLatLngs(pts)}
    else{
      rGlow=L.polyline(pts,{color:"#ff7a1a",weight:12,opacity:.28,lineCap:"round"}).addTo(map);
      rLine=L.polyline(pts,{color:"#ffb300",weight:5,opacity:.95,lineCap:"round",lineJoin:"round"}).addTo(map);
    }
    const isUltimo=wps.length===1;
    const ehDestinoFinal=isUltimo&&(c.status!=="aceita")&&(at>=paradas.length);
    const icone=ehDestinoFinal?"🏁":(c.status==="aceita"?"🧍":"📍");
    if(!dMark)dMark=L.marker(alvo,{icon:L.divIcon({html:`<div class="pin">${icone}</div>`,className:"",iconSize:[30,30],iconAnchor:[6,28]})}).addTo(map);
    else{dMark.setLatLng(alvo);const el=dMark.getElement();if(el)el.innerHTML=`<div class="pin">${icone}</div>`}
    dMark.bindTooltip(alvoNome(c),{direction:"top",offset:[0,-26]});
    const st=(rt.legs[0].steps||[]).find(s=>s.maneuver&&s.maneuver.type!=="depart"&&s.maneuver.type!=="arrive");
    let prox="";
    if(st){const m=st.maneuver,tx=m.type==="roundabout"||m.type==="rotary"?"Entre na rotatória":(MAN[m.modifier]||"Siga em frente");
      prox=`<div style="margin-top:3px">↪ ${tx}${st.name?" · "+esc(st.name):""}</div>`}
    const restTxt=isUltimo?"":` <span style="color:var(--mut)">(+${wps.length-1} ponto${wps.length-1>1?"s":""})</span>`;
    const i=$("mInfo");i.innerHTML=`<b>${fmtD(rt.legs[0].distance)}</b> · ${Math.max(1,Math.round(rt.legs[0].duration/60))} min até ${esc(curta(alvoNome(c),28))}${restTxt}${prox}`;i.style.display="block";
    rFrom=[me.lat,me.lng];
    if(mudou){
      rKey=key;
      if(c.status==="a_caminho"){follow=true;$("bCen").classList.remove("on");map.setView([me.lat,me.lng],16)}
      else{follow=false;$("bCen").classList.add("on");map.fitBounds(L.latLngBounds(pts),{padding:[50,50]})}
    }
  }catch(e){
    if(mudou&&map){
      limparRota();
      rGlow=L.polyline([[me.lat,me.lng],alvo],{color:"#ffb300",weight:4,dashArray:"8 10"}).addTo(map);
      dMark=L.marker(alvo,{icon:L.divIcon({html:'<div class="pin">📍</div>',className:"",iconSize:[30,30],iconAnchor:[6,28]})}).addTo(map);
      rKey=key;rFrom=[me.lat,me.lng];
    }
  }finally{rBusy=false}
}
function syncMapa(lista){
  if(!map)return;
  pMarks.forEach(m=>map.removeLayer(m));pMarks=[];
  lista.filter(c=>c.status==="pendente"&&c.destino_lat!=null&&agDentroDoHorario(c,60)).forEach(c=>{
    pMarks.push(L.marker([+c.destino_lat,+c.destino_lng],{icon:L.divIcon({html:c.agendada_para?'<div class="pin">🕐</div>':'<div class="pin">📍</div>',className:"",iconSize:[30,30],iconAnchor:[15,28]})}).bindTooltip(brl(c.valor)+(c.agendada_para?" · "+fmtHora(c.agendada_para):""),{permanent:true,direction:"top",offset:[0,-26]}).addTo(map));
  });
  const at=lista.find(c=>c.status==="a_caminho")||lista.find(c=>c.status==="aceita");
  if(at)rota(at);else if(rKey||rLine||rGlow)limparRota();
}
async function toggleOnline(){
  if(!me.online){
    if(!("geolocation" in navigator)){toast("Seu navegador não suporta localização");return}
    navigator.geolocation.getCurrentPosition(async pos=>{
      me.online=true;me.lat=pos.coords.latitude;me.lng=pos.coords.longitude;
      await updMe({online:true,lat:me.lat,lng:me.lng,atualizado_em:new Date().toISOString()});
      onlineOn();startWatch();mostrarTab("painel");
    },err=>{toast("Ative a localização para ficar online")},{enableHighAccuracy:true});
  }else{
    stopWatch();me.online=false;await updMe({online:false});onlineOff();mostrarTab("painel");
  }
}
function startWatch(){
  stopWatch();travarTela();
  watchId=navigator.geolocation.watchPosition(setPos,null,{enableHighAccuracy:true,maximumAge:2000});

}
function stopWatch(){
  if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;
  clearInterval(sendTm);sendTm=null;
}

        <div class="sc"><span>CORRIDAS HOJE</span><b>${hoje.length}</b></div>
      </div>
      ${coments.length?`<div style="margin-top:10px;border-top:1px dashed var(--bd);padding-top:6px"><div class="k" style="font-weight:700;margin-bottom:4px">💬 Últimas avaliações</div>${coments.map(c=>`<div class="avl"><span style="flex:none">${"⭐".repeat(c.avaliacao)}</span><span class="k">${esc(c.comentario)}</span></div>`).join("")}</div>`:""}
    </div>
    <div class="k" style="text-align:center">💡 Use o 🔥 no mapa para encontrar zonas de alta demanda.</div>`;
    $("metaB").onclick=()=>{const v=+$("metaV").value||150;localStorage.setItem("meta_dia",v);toast("Meta definida: "+brl(v));tabGanhos()};
  }catch(e){$("app").innerHTML='<div class="empty">Sem conexão. Tente de novo.</div>'}
}
function faltam(v,m){const f=m-v;return "Faltam "+brl(f)+" ("+Math.round(v/m*100)+"% da meta)"}

/* ====== ABA PERFIL ====== */
function tabPerfil(){
  const temDir=!!LS("dir_lat");
  $("app").innerHTML=`
  <div class="card" style="text-align:center;padding:22px 16px">
    <div style="width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,#ff8a2b,#ff6a00);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#1a1204">${esc((me.nome||"?").trim().split(/\s+/).map(p=>p[0]).slice(0,2).join("").toUpperCase())}</div>
    <b style="font-size:19px">${esc(me.nome)}</b>
    <div class="k">Motorista parceiro STEVEDRIVE</div>
  </div>
  <div class="card">
    <b>🏍️ Dados públicos (cliente vê)</b>
    <label class="lbl" style="margin-top:10px">Nome</label><input id="pNome" value="${esc(me.nome)}">
    <label class="lbl" style="margin-top:10px">WhatsApp</label><input id="pTel" type="tel" value="${esc(me.telefone||"")}">
    <label class="lbl" style="margin-top:10px">Placa da moto</label><input id="pPlaca" value="${esc(me.placa||"")}" placeholder="ABC1D23">
    <div class="grid2" style="margin-top:10px">
      <div><label class="lbl">Veículo</label><input id="pVeic" value="${esc(me.veiculo||"")}" placeholder="Honda CG 160"></div>
      <div><label class="lbl">Cor</label><input id="pCor" value="${esc(me.cor||"")}" placeholder="Vermelha"></div>
    </div>
    <label class="lbl" style="margin-top:10px">Preço por km</label>
    <div class="row" style="gap:8px"><input id="pPreco" type="number" step="0.10" min="0.5" value="${me.preco_km}"><button class="btn ghost sm" id="pSalvar" style="min-height:48px">Salvar tudo</button></div>
  </div>
  <div class="card">
    <b>🧭 Direção definida</b>
    <div class="k" style="margin:4px 0 10px">Você recebe um aviso ⚠️ quando uma corrida sair da direção para onde está indo (ex.: caminho de casa).</div>
    ${temDir?`<div class="pill ok">🏠 Direção ativa (${(+LS("dir_lat")).toFixed(4)}, ${(+LS("dir_lng")).toFixed(4)})</div><button class="btn ghost" id="dirOff" style="margin-top:10px">Remover direção</button>`:`<button class="btn ghost" id="dirOn">Usar minha localização atual como direção</button>`}
  </div>
  <div class="card">
    <b>📈 Números</b>
    <div class="sgrid" style="margin-top:10px">
      <div class="sc"><span>TEMPO ONLINE HOJE</span><b>${tempoOnlineHoje()}</b></div>
      <div class="sc"><span>TAXA DE ACEITAÇÃO</span><b>${accRate()}</b></div>
    </div>
  </div>
  <button class="btn ghost" id="btnSair" style="margin-top:4px">Sair da conta</button>`;
  $("pSalvar").onclick=async()=>{
    const fields={nome:$("pNome").value.trim(),telefone:$("pTel").value.trim(),preco_km:+$("pPreco").value||me.preco_km};
    try{await updMe({...fields,placa:$("pPlaca").value.trim().toUpperCase(),veiculo:$("pVeic").value.trim(),cor:$("pCor").value.trim()})}
    catch(e){try{await updMe(fields)}catch(x){toast("Erro: "+x.message);return}}
    me.nome=fields.nome;me.preco_km=fields.preco_km;me.telefone=fields.telefone;
    toast("Perfil salvo ✓");
  };
  const dOn=$("dirOn");
  if(dOn)dOn.onclick=()=>{
    if(me.lat==null){toast("Aguarde a localização…");return}
    localStorage.setItem("dir_lat",me.lat);localStorage.setItem("dir_lng",me.lng);
    toast("🏠 Direção definida");tabPerfil();
  };
  const dOff=$("dirOff");
  if(dOff)dOff.onclick=()=>{localStorage.removeItem("dir_lat");localStorage.removeItem("dir_lng");toast("Direção removida");tabPerfil()};
  $("btnSair").onclick=async()=>{if(me&&me.online){stopWatch();onlineOff();try{await updMe({online:false})}catch(e){}}irLogin()};
}

/* ====== RENDER ====== */
async function render(){
  if(!sessGet()){loginScreen();return}
  try{me=await getMe();
    const pend=(()=>{try{return JSON.parse(localStorage.getItem("moto_pend")||"null")}catch(e){return null}})();
    if(!me&&pend){try{await api("motoboys",{method:"POST",prefer:"return=minimal",body:JSON.stringify(Object.assign({id:uid()},pend))});me=await getMe()}catch(e){}}
    if(me)localStorage.removeItem("moto_pend");
    if(!me){onboarding();return}}
  catch(e){if(!sessGet())return;$("app").innerHTML='<div class="empty">Sem conexão. Verifique a internet.</div>';return}
  if(me.online){onlineOn();if(navigator.geolocation)startWatch()}
  $("tabbar").style.display="flex";
  mostrarTab("painel");
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
</body>
</html>
